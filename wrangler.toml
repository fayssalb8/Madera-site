name = "madera-kitchen"
compatibility_date = "2024-12-01"
pages_build_output_dir = "./dist"

# Cloudflare D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "madera-db"
database_id = "YOUR_D1_DATABASE_ID"

# Cloudflare R2 storage binding
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "madera-media"

# Environment variables (set via Cloudflare Dashboard > Pages > Settings > Environment Variables)
# ADMIN_EMAIL       = "admin@madera.dz"
# ADMIN_PASSWORD    = "your-strong-password"
# SESSION_SECRET    = "your-64-char-hex-secret"
# APP_ORIGIN        = "https://maderakitchen-dz.com"
# TOTP_SECRET       = "" (optional)
# LEAD_NOTIFY_WEBHOOK_URL = "" (optional)
